name: Build Flet APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build APK
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.13"
          bundled-python-version: "3.13"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: finance-mobile-apk
          path: build/**/*.apk
          if-no-files-found: error
