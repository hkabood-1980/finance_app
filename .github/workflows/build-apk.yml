name: Build Flet APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.0.3 flet-charts==1.0.3

      - name: Build APK
        run: |
          flet build apk --python-version 3.13

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: finance-mobile-apk
          path: build/**/*.apk
          if-no-files-found: error
